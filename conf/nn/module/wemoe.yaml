
defaults:
  - _self_
  - encoder: b32 #b16, b32, l14
  - aggregator: tsvm

_target_: mass.pl_module.smile.WeightEnsemblingMoEAlgorithm

x_key: ${conventions.x_key}
y_key: ${conventions.y_key}
dataset_names: {eval_dataset}

image_encoder: ??  
finetuned_models: ??
classification_heads: ??


checkpoint: False
save_checkpoint: False
router_hidden_layers: 2
init_lambda: 0.3
batch_reduce: true
use_grad_accumulate: true
model_path: null


optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  weight_decay: 0.1
  # _target_: torch.optim.SGD
  # lr: 0.1
  # momentum: 0.9
  # weight_decay: 1e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 10



