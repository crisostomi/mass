core:
  project_name: mass
  storage_dir: ${oc.env:PROJECT_ROOT}/storage
  entity: gladia
  version: 0.0.1
  tags: 
  - benchmark


defaults:
  - hydra: default
  - nn: default
  - train: default
  - benchmark: n8
  - hydra/launcher: basic
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_ # as last argument to allow the override of parameters via this main config

seed_index: 0
num_tasks: 0
data_batch_size: 128
base: tsvm
similarity_threshold: 0.3
eval_on_train: false
number_of_train_batches: -1 # number of batches of the val set, used for grid search
device: 'cuda'

conventions:
  x_key: 'x'
  y_key: 'y'

eval_datasets: ${benchmark.datasets}

# compression_ratio = 1 / svd_compress_factor, if null the ratio is set to 1 / num_tasks
svd_compress_factor: null

task_vectors:
  to_remove:
    - "DTD"
  scaling_coefficient: 1.0

  aggregator:
    _target_: mass.task_vectors.aggregator.TaskSingularVectorAggregator
    zeroshot_model: ???

    # _target_: mass.task_vectors.aggregator.SphericalAggregator
    # _target_: mass.task_vectors.aggregator.SumAggregator
    # mean: false
    # rescaling: 0.3

misc:
  ckpt_path: ${oc.env:MODELS_PATH}/${nn.encoder.model_name}
  pretrained_checkpoint: ${misc.ckpt_path}/MNISTVal/nonlinear_zeroshot.pt
  openclip_cachedir: "${oc.env:PROJECT_ROOT}/checkpoints/openclip_cache/"
  checkpoint_dir: ${oc.env:PROJECT_ROOT}/checkpoints/linear_router
  svd_path: "${oc.env:PROJECT_ROOT}/checkpoints/svd_dict_${nn.encoder.model_name}_${num_tasks}.pt"
  finetuned_accuracy_path: "${oc.env:PROJECT_ROOT}/results/finetuning/accs.json"
  results_path: "${oc.env:PROJECT_ROOT}/results/${nn.encoder.model_name}/"


optimal_alphas:
  ViT-B-32:
    8: 1.00
    14: 1.00
    20: 0.90
  ViT-B-16:
    8: 1.40
    14: 1.20
    20: 1.00
  ViT-L-14:
    8: 1.50
    14: 1.30
    20: 1.00
